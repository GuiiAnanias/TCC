# Roda nos PRs para integração ou funcionalidades e nos pushes para develop/main.
# Confere formatação (Prettier), lint (ESLint), testes, migrations e build.
# Se algum passo falhar, o PR fica marcado com X vermelho e não deve ser mergeado.
name: CI

on:
  pull_request:
    branches: [develop, main, "feature/**", "fix/**"]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes e migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sistema_indicadores
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistema_indicadores
      JWT_SECRET: segredo-somente-para-o-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pnpm
        run: npm install --global pnpm@11.19.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Formatação (Prettier)
        run: pnpm run format:check
      - name: Lint (ESLint)
        run: pnpm run lint
      - name: Gerar Prisma Client
        run: pnpm run prisma:generate
      - name: Testes unitários
        run: pnpm test
      - name: Migrations em banco limpo
        run: pnpm exec prisma migrate deploy
      - name: Testes de integração com banco (sessões)
        run: pnpm run test:auth-db
      - name: Testes de integração com banco (seed)
        run: pnpm run test:seed-db
      - name: Testes de integração com banco (dashboard)
        run: pnpm run test:dashboard-db
      - name: Testes de integração com banco (custos faturados)
        run: pnpm run test:invoiced-costs-db
      - name: Testes de integração com banco (equipe)
        run: pnpm run test:team-db
      - name: Testes de integração com banco (exclusão de projetos)
        run: pnpm run test:project-deletion-db
      - name: Testes de integração com banco (relatórios)
        run: pnpm run test:reports-db
      - name: Testes de integração com banco (tarefas)
        run: pnpm run test:tasks-db
      - name: Testes de integração com banco (concorrência de apontamentos)
        run: pnpm run test:hours-db
      - name: Testes de integração com banco (importação e exportação em Excel)
        run: pnpm run test:excel-db
      - name: Testes de integração com banco (premiação)
        run: pnpm run test:awards-db
      - name: Testes de integração com banco (histórico financeiro)
        run: pnpm run test:finance-db

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pnpm
        run: npm install --global pnpm@11.19.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Formatação (Prettier)
        run: pnpm run format:check
      - name: Lint (ESLint)
        run: pnpm run lint
      - name: Build de produção
        run: pnpm run build
      - name: Regressões da interface
        run: pnpm test
