services:
  postgres:
    image: postgres:16
    container_name: sistema_indicadores_postgres
    environment:
      POSTGRES_DB: sistema_indicadores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caixa de e-mail local para desenvolvimento e demonstração: recebe as mensagens
  # do sistema (porta SMTP 1025) e as mostra em http://localhost:8025. Nada sai para a internet.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: sistema_indicadores_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
